<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টাইগার স্পিড - প্রিমিয়াম ই-কমার্স</title>
    <style>
        :root {
            --primary-blue: #0047AB;
            --gold: #FFD700;
            --dark: #111111;
            --light: #F9F9F9;
        }
        body {
            font-family: 'SolaimanLipi', Arial, sans-serif;
            margin: 0;
            background-color: var(--light);
            color: var(--dark);
        }
        header {
            background: var(--dark);
            color: var(--gold);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--gold);
        }
        .hero {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('tiger-banner.mp4');
            background-size: cover;
            color: white;
            text-align: center;
            padding: 100px 20px;
        }
        .hero h1 {
            color: var(--gold);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .cta-btn {
            background-color: var(--gold);
            color: var(--dark);
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }
        .products-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 40px;
            max-width: 1200px;
            margin: auto;
        }
        .product-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h2>🐯 টাইগার স্পিড</h2>
        <nav>
            <a href="#" style="color: white; margin-right: 20px; text-decoration: none;">হোম</a>
            <a href="#" style="color: white; margin-right: 20px; text-decoration: none;">পণ্যসমূহ</a>
            <a href="#" style="color: white; text-decoration: none;">যোগাযোগ</a>
        </nav>
    </header>

    <section class="hero">
        <h1>টাইগার স্পিডে আপনাকে স্বাগতম!</h1>
        <p>সেরা মানের গ্যাজেট, শাড়ি, বোরকা ও সাইকেল এখন এক ঠিকানায়।</p>
        <a href="#products" class="cta-btn">অর্ডার করুন</a>
    </section>

    <div id="products" class="products-container">
        <!-- প্রোডাক্ট কার্ড ডেমো -->
        <div class="product-card">
            <h3>স্মার্ট গ্যাজেট</h3>
            <p>প্রিমিয়াম কোয়ালিটি</p>
            <p style="color: var(--primary-blue); font-weight: bold;">মূল্য: ১৫০০ টাকা</p>
            <button class="cta-btn" style="padding: 8px 15px; font-size: 0.9rem;">কিনুন</button>
        </div>
    </div>

</body>
</html>
